<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Picks</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css?v=clerk-1">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">GP</span>
      <div>
        <strong>Game Picks</strong>
        <div class="sub">Season pick-em · outright / ATS / O/U</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" data-page="home" class="on" title="Week snapshot and leaderboard preview">Home</button>
      <button type="button" data-page="week" title="Make and edit wagers for the current week">Current Week</button>
      <button type="button" data-page="standings" title="Season standings">Standings</button>
      <button type="button" data-page="history" title="Multi-year team splits">History</button>
      <button type="button" data-page="rules" title="Pool rules">Rules</button>
    </nav>
    <div id="auth-slot" class="auth-slot">
      <p id="auth-notice" class="auth-notice" hidden>Auth not configured</p>
      <div id="clerk-signed-out" class="clerk-signed-out" hidden>
        <button type="button" data-oauth="oauth_google" title="Sign in with Google">Google</button>
        <button type="button" data-oauth="oauth_apple" title="Sign in with Apple">Apple</button>
        <button type="button" data-oauth="oauth_x" title="Sign in with X">X</button>
        <button type="button" id="btn-sign-in" title="Sign in with Google, Apple, or X">Sign in</button>
        <button type="button" id="btn-sign-up" title="Create an account">Sign up</button>
      </div>
      <div id="clerk-user-button" class="clerk-user-button" hidden></div>
      <span id="who" class="who"></span>
    </div>
  </header>
  <p id="db-banner" class="db-banner" hidden></p>
  <main id="app"></main>
  <script src="/app.js?v=clerk-1"></script>
</body>
</html>
