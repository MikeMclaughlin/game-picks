<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Picks</title>
  <meta name="description" content="Season pick-em · outright / ATS / O/U">
  <meta property="og:title" content="Game Picks">
  <meta property="og:description" content="Season pick-em · outright / ATS / O/U">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Game Picks">
  <meta name="twitter:description" content="Season pick-em · outright / ATS / O/U">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css?v=version-1.18">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">GP</span>
      <div>
        <strong>Game Picks</strong>
        <div class="sub">Season pick-em · outright / ATS / O/U</div>
      </div>
    </div>
    <button type="button" id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" title="Open menu">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="sr">Menu</span>
    </button>
    <div id="site-nav" class="site-nav">
      <nav class="tabs" id="tabs">
        <button type="button" data-page="week" class="on" title="Make and edit wagers for any unlocked week">Home</button>
        <button type="button" data-page="picks" title="Current week picks for AI, Biggest Loser, and Comeback Kid">Picks</button>
        <button type="button" data-page="standings" title="Season standings">Standings</button>
        <button type="button" data-page="performance" title="Weekly and season records for AI picks and other betting criteria">Pick Performance</button>
        <button type="button" data-page="history" title="Multi-year team splits">History</button>
        <button type="button" data-page="backtest" title="Query historical patterns and Markov-style sequences">Backtest</button>
      </nav>
      <div id="auth-slot" class="auth-slot">
        <p id="auth-notice" class="auth-notice" hidden>Auth not configured</p>
        <div id="auth-signed-out" class="auth-signed-out" hidden>
          <span class="auth-label">Social Media sign in</span>
          <button type="button" id="btn-google" data-oauth="google" title="Sign in with Google">Google</button>
          <button type="button" id="btn-sign-in" title="Sign in with Google">Sign in</button>
          <button type="button" id="btn-sign-up" title="Create an account with Google">Sign up</button>
        </div>
        <div id="user-button" class="user-button" hidden>
          <button type="button" id="user-menu-btn" title="Account">
            <span class="user-avatar" id="user-avatar" aria-hidden="true"></span>
            <span class="sr" id="user-menu-label">Account</span>
          </button>
          <div id="user-menu" class="user-menu" hidden>
            <button type="button" id="btn-sign-out" title="Sign out">Sign out</button>
          </div>
        </div>
        <span id="who" class="who"></span>
      </div>
    </div>
  </header>
  <p id="db-banner" class="db-banner" hidden></p>
  <main id="app">
    <div id="app-view"></div>
    <div id="load-overlay" class="load-overlay" hidden>
      <div class="load-spinner" role="status" aria-label="Loading"></div>
    </div>
  </main>
  <footer class="site-foot" id="build-foot">Game Picks · Version 1.18</footer>
  <script src="/app.js?v=version-1.18"></script>
</body>
</html>
